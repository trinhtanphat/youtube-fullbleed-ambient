<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Fullbleed Ambient</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">YOUTUBE IMMERSIVE</div>
        <h1>Fullbleed Ambient</h1>
        <p>Ambient that stays useful while you scroll.</p>
      </div>
      <label class="switch" aria-label="Enable extension">
        <input id="enabled" type="checkbox">
        <span></span>
      </label>
    </header>

    <section class="panel">
      <div class="section-title">Experience</div>

      <label for="mode">Top-player mode</label>
      <select id="mode">
        <option value="ambient">Ambient page</option>
        <option value="focus">Focus fill on open</option>
      </select>

      <div class="grid">
        <div>
          <label for="scrollMode">When scrolling</label>
          <select id="scrollMode">
            <option value="dock">Keep video docked</option>
            <option value="off">Normal YouTube</option>
          </select>
        </div>
        <div>
          <label for="dockSize">Dock size</label>
          <select id="dockSize">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
      </div>

      <label class="check-row">
        <span>
          <strong>Live-video topbar</strong>
          <small>Paints a low-rate blurred strip from the playing video behind YouTube's top bar.</small>
        </span>
        <input id="topbarVideo" type="checkbox">
      </label>

      <label class="check-row">
        <span>
          <strong>Ad Shield</strong>
          <small>Blocks common ad hosts and auto-skips or accelerates in-player ads when possible.</small>
        </span>
        <input id="adBlock" type="checkbox">
      </label>

      <label class="check-row">
        <span>
          <strong>Calm reading mode</strong>
          <small>Softens ambient while reading comments.</small>
        </span>
        <input id="readingCalm" type="checkbox">
      </label>

      <label class="check-row">
        <span>
          <strong>Glass comments</strong>
          <small>Keeps comments readable without hiding the scene.</small>
        </span>
        <input id="commentGlass" type="checkbox">
      </label>
    </section>

    <section class="panel">
      <div class="section-title">Ambient look</div>
      <label for="brightness">Brightness <output id="brightnessValue"></output></label>
      <input id="brightness" type="range" min="20" max="100" step="1">

      <label for="blur">Softness <output id="blurValue"></output></label>
      <input id="blur" type="range" min="12" max="80" step="1">

      <div class="grid">
        <div>
          <label for="fps">Render FPS</label>
          <select id="fps">
            <option value="2">2 - Eco</option>
            <option value="4">4 - Balanced</option>
            <option value="6">6 - Smooth</option>
            <option value="10">10 - Max</option>
          </select>
        </div>
        <div>
          <label for="quality">Canvas</label>
          <select id="quality">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
    </section>

    <section class="actions">
      <button id="toggleDock" type="button">Dock / undock</button>
      <button id="toggleFocus" type="button">Focus fill</button>
      <button id="reset" type="button" class="secondary wide">Reset defaults</button>
    </section>

    <div class="status-row">
      <span id="liveDot" class="dot"></span>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <p class="hint">Alt+Shift+D toggles dock - Alt+Shift+A toggles ambient - Esc exits Focus fill.</p>
  </main>
  <script src="helpers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
